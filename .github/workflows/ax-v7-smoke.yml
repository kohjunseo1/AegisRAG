name: AX V7 data and code smoke
on:
  push:
    branches: [feature/unified-v1]
    paths:
      - 'scripts/ax_v7_*.py'
      - 'tests/test_ax_v7_train_prep.py'
      - '.github/workflows/ax-v7-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install smoke dependencies only
        run: python -m pip install pytest
      - name: Parse all V7 Python modules
        run: python -m py_compile scripts/ax_v7_train.py scripts/ax_v7_eval.py scripts/ax_v7_make_data.py scripts/ax_v7_audit_data.py scripts/ax_v7_review_cases.py tests/test_ax_v7_train_prep.py
      - name: Dataset and label-contract unit tests
        run: python -m pytest -q tests/test_ax_v7_train_prep.py
      - name: Smoke-generate schema fixtures (no private data, no HF)
        run: python scripts/ax_v7_make_data.py --out /tmp/v7_bootstrap --train-n 100 --dev-n 30
      - name: Audit generated corpus quality-v3 (no model)
        run: python scripts/ax_v7_audit_data.py --train /tmp/v7_bootstrap/train.jsonl --dev /tmp/v7_bootstrap/dev.jsonl
