name: aegisrag-blind-eval

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: aegis_blind_test
      RAG_PASSWORD: ${RAG_PASSWORD:?required}
      RAG_READONLY_PASSWORD: ${RAG_READONLY_PASSWORD:?required}
      VAULT_PASSWORD: ${VAULT_PASSWORD:?required}
      EMBED_DIM: 1024
    ports:
      - "127.0.0.1:5544:5432"
    volumes:
      - blind_pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d aegis_blind_test"]
      interval: 5s
      timeout: 3s
      retries: 15

volumes:
  blind_pgdata:
