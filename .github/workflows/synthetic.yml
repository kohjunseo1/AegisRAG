name: Synthetic contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install python-dotenv==1.2.4 numpy==1.26.4 psycopg[binary]==3.3.6
      - run: python -m unittest discover -s step1_pii_detector/tests -v
        env:
          PYTHONPATH: step1_pii_detector:step1_pii_detector/src
      - run: python -m unittest discover -s step2_privacy_rag/tests -v
        env:
          PYTHONPATH: step2_privacy_rag/app
      - run: python -m py_compile scripts/benchmark_step1_reuse.py scripts/check_step1_reuse_parity.py scripts/benchmark_preload.py
      - run: python scripts/benchmark_preload.py --help
      - run: python scripts/check_step1_reuse_parity.py --help
      - run: python -m py_compile scripts/diagnose_review_q001.py
      - run: python scripts/diagnose_review_q001.py --help
      - run: python scripts/aegisrag.py smoke
      - run: python scripts/scan_git.py --history
